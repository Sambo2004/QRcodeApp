<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Smart Barcode + IMEI Scanner</title>

  <!-- Barcode Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <!-- OCR -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      background:#0f172a;
      font-family:Arial,sans-serif;
      color:white;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:600px;
      background:#1e293b;
      border-radius:25px;
      padding:25px;
      box-shadow:0 10px 30px rgba(0,0,0,0.4);
    }

    h1{
      text-align:center;
      margin-bottom:25px;
      font-size:42px;
    }

    input[type=file]{
      width:100%;
      background:#334155;
      padding:15px;
      border:none;
      border-radius:14px;
      color:white;
      font-size:16px;
    }

    .preview{
      margin-top:25px;
      text-align:center;
    }

    .preview img{
      width:100%;
      max-height:550px;
      object-fit:contain;
      border-radius:20px;
      background:#0b1220;
    }

    .result{
      margin-top:25px;
      background:#334155;
      padding:20px;
      border-radius:18px;
      word-break:break-word;
      line-height:1.8;
    }

    .title{
      color:#94a3b8;
      font-size:14px;
      margin-bottom:10px;
      text-transform:uppercase;
      letter-spacing:1px;
    }

    .success{
      color:#4ade80;
      font-size:20px;
      font-weight:bold;
      margin-top:15px;
    }

    .error{
      color:#f87171;
      font-size:20px;
      font-weight:bold;
      margin-top:15px;
    }

    .info{
      color:#facc15;
      margin-top:15px;
      font-weight:bold;
    }

    button{
      width:100%;
      margin-top:18px;
      border:none;
      border-radius:14px;
      background:#3b82f6;
      color:white;
      padding:14px;
      font-size:18px;
      cursor:pointer;
    }

    button:hover{
      background:#2563eb;
    }

    .loading{
      text-align:center;
      margin-top:15px;
      color:#93c5fd;
      font-weight:bold;
    }

    .small{
      font-size:13px;
      color:#cbd5e1;
      margin-top:12px;
    }

    .scan-box{
      border:2px dashed #60a5fa;
      padding:15px;
      border-radius:15px;
      margin-top:15px;
    }

  </style>
</head>
<body>
<img src="src/R.gif" alt="Background Image" style="position:fixed; top:0; left:0; width:100%; height:100%; object-fit:cover; z-index:-1; opacity:0.3;">
<div class="container">

  <h1>Upload QR / Barcode</h1>

  <input type="file" id="fileInput" accept="image/*">

  <div class="preview" id="preview"></div>

  <div class="result" id="result">
    Upload image to scan QR / Barcode / IMEI
  </div>

  <button onclick="copyResult()">
    Copy Result
  </button>

</div>

<div id="reader" style="display:none;"></div>

<script>

let scannedText = "";

const fileInput = document.getElementById("fileInput");
const previewDiv = document.getElementById("preview");
const resultDiv = document.getElementById("result");

fileInput.addEventListener("change", async (e) => {

  const file = e.target.files[0];

  if(!file) return;

  scannedText = "";

  const imageURL = URL.createObjectURL(file);

  previewDiv.innerHTML = `
    <img src="${imageURL}">
  `;

  resultDiv.innerHTML = `
    <div class="loading">
      🔍 Scanning image...
    </div>
  `;

  // ==================================
  // TRY BARCODE / QR FIRST
  // ==================================

  let barcodeFound = false;

  try {

    const html5QrCode = new Html5Qrcode(
      "reader",
      {
        formatsToSupport: [

          Html5QrcodeSupportedFormats.QR_CODE,

          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39,
          Html5QrcodeSupportedFormats.CODE_93,

          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.EAN_8,

          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.UPC_E

        ]
      }
    );

    // false = keep original image size
    const result = await html5QrCode.scanFile(file, false);

    barcodeFound = true;

    scannedText = result;

    showResult(result, "BARCODE / QR");

  } catch(err){

    console.log("Barcode failed");
    console.log(err);

  }

  // ==================================
  // OCR FALLBACK
  // ==================================

  if(!barcodeFound){

    try {

      resultDiv.innerHTML = `
        <div class="loading">
          🤖 Barcode not found...
          <br><br>
          Trying OCR text detection...
        </div>
      `;

      const {
        data: { text }
      } = await Tesseract.recognize(
        file,
        'eng'
      );

      console.log(text);

      // Remove spaces/newlines
      const cleanText = text.replace(/\s/g, "");

      // Find IMEI
      const imeiMatch = cleanText.match(/\d{15}/);

      // Find GT06N etc
      const modelMatch = text.match(/GT[0-9A-Z]+/i);

      let html = `
        <div class="title">
          OCR TEXT RESULT
        </div>

        <div class="scan-box">
          ${text.replace(/\n/g, "<br>")}
        </div>
      `;

      // IMEI FOUND
      if(imeiMatch){

        scannedText = imeiMatch[0];

        html += `
          <div class="success">
            ✅ IMEI Found
          </div>

          <br>

          <div>
            <strong>IMEI:</strong>
            ${imeiMatch[0]}
          </div>
        `;

      }

      // MODEL FOUND
      if(modelMatch){

        html += `
          <div class="info">
            📦 Device Model:
            ${modelMatch[0]}
          </div>
        `;

      }

      // NOTHING FOUND
      if(!imeiMatch && !modelMatch){

        html += `
          <div class="error">
            ❌ No IMEI or barcode detected
          </div>

          <div class="small">
            Try clearer image or crop barcode only
          </div>
        `;

      }

      resultDiv.innerHTML = html;

    } catch(err){

      console.log(err);

      resultDiv.innerHTML = `
        <div class="error">
          ❌ Scan Failed
        </div>

        <div class="small">
          Possible reasons:
          <br><br>

          • blurry image
          <br>
          • barcode too small
          <br>
          • unsupported barcode
          <br>
          • low brightness
        </div>
      `;

    }

  }

});

function showResult(result, type){

  let html = `
    <div class="title">
      ${type} RESULT
    </div>

    <div class="scan-box">
      ${result}
    </div>
  `;

  const clean = result.replace(/\s/g, "");

  // IMEI
  if(/^\d{15}$/.test(clean)){

    html += `
      <div class="success">
        ✅ Valid IMEI Number
      </div>
    `;

  }

  // URL
  else if(
    result.startsWith("http://") ||
    result.startsWith("https://")
  ){

    html += `
      <div class="success">
        🌐 URL Detected
      </div>

      <br>

      <a href="${result}" target="_blank">
        Open Link
      </a>
    `;

  }

  // NUMBER
  else if(/^[0-9]+$/.test(clean)){

    html += `
      <div class="info">
        📦 Numeric Barcode Detected
      </div>
    `;

  }

  // TEXT
  else {

    html += `
      <div class="info">
        🏷 Text Barcode Detected
      </div>
    `;

  }

  resultDiv.innerHTML = html;

}

function copyResult(){

  if(!scannedText){

    alert("No result to copy");
    return;

  }

  navigator.clipboard.writeText(scannedText);

  alert("Copied!");

}

</script>

</body>
</html>
